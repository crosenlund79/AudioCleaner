[package]
name = "arfilter"
version = "1.0.0"
edition = "2021"
description = "AudioRefine streaming speech filter: high-pass, hum notches, DeepFilterNet3 noise reduction, presence EQ"
license = "MIT"
publish = false

[dependencies]
# DeepFilterNet 0.5.6 (MIT OR Apache-2.0), pinned to the release tag commit.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "978576aa8400552a4ce9730838c635aa30db5e61", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
