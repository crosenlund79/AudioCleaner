name: Windows build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      APP_VERSION: "1.0.0"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Restore Rust build cache
        id: cargocache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/arfilter/target
          key: cargo-win-${{ hashFiles('native/arfilter/Cargo.toml', 'native/arfilter/Cargo.lock', 'native/arfilter/src/**') }}

      - name: Build arfilter (DeepFilterNet3 + filters, Rust)
        run: |
          rustc --version
          cargo build --release --locked --manifest-path native/arfilter/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit 1 }
          native/arfilter/target/release/arfilter.exe --info

      - name: Save Rust build cache
        if: steps.cargocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/arfilter/target
          key: cargo-win-${{ hashFiles('native/arfilter/Cargo.toml', 'native/arfilter/Cargo.lock', 'native/arfilter/src/**') }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Cache small test model
        id: tinycache
        uses: actions/cache@v4
        with:
          path: test-model
          key: faster-whisper-tiny-v1

      - name: Download small test model (whisper tiny, tests only)
        if: steps.tinycache.outputs.cache-hit != 'true'
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-tiny', local_dir='test-model')"

      - name: Run test suite on Windows
        env:
          AUDIOREFINE_TEST_MODEL: ${{ github.workspace }}\test-model
        run: |
          python -m pytest -q -m "not slow" --junitxml=test-results.xml
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build portable application (PyInstaller)
        run: |
          pyinstaller packaging/audiorefine.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item README.md dist/AudioRefine/README.md
          Get-ChildItem dist/AudioRefine | Format-Table Name, Length
          "{0:N0} MB" -f ((Get-ChildItem dist/AudioRefine -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - name: Packaged self-test
        run: |
          dist/AudioRefine/AudioRefineEngine.exe version
          dist/AudioRefine/AudioRefineEngine.exe selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist/AudioRefine/AudioRefineEngine.exe --json status

      - name: Prepare end-to-end test folder (real Danish and English speech)
        run: python tools/ci/make_e2e_folder.py "$env:RUNNER_TEMP\Audio dumps"

      - name: Packaged GUI smoke test (native Windows platform, screenshot)
        run: |
          $guiArgs = @('--screenshot', "`"$env:RUNNER_TEMP\gui.png`"", '--folder', "`"$env:RUNNER_TEMP\Audio dumps`"")
          function Run-Gui {
            $p = Start-Process -FilePath dist/AudioRefine/AudioRefine.exe -ArgumentList $guiArgs -PassThru
            if (-not $p.WaitForExit(180000)) { $p.Kill(); return -1 }
            return $p.ExitCode
          }
          $rc = Run-Gui
          "GUI exit code (native platform): $rc"
          if ($rc -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\gui.png")) {
            # fall back to the offscreen platform (renders without system fonts on Windows)
            $env:QT_QPA_PLATFORM = 'offscreen'
            $rc = Run-Gui
            "GUI exit code (offscreen): $rc"
            if ($rc -ne 0) { exit 1 }
          }

      - name: Cache speech recognition model (Whisper large-v3)
        uses: actions/cache@v4
        with:
          path: models-cache
          key: whisper-large-v3-edaa852ec7e1

      - name: Packaged first-run model download (resumable, verified)
        env:
          AUDIOREFINE_MODELS_DIR: ${{ github.workspace }}\models-cache
        run: |
          dist/AudioRefine/AudioRefineEngine.exe --json download | Select-Object -Last 2
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Packaged end-to-end processing run
        env:
          AUDIOREFINE_MODELS_DIR: ${{ github.workspace }}\models-cache
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          dist/AudioRefine/AudioRefineEngine.exe --json process "$env:RUNNER_TEMP\Audio dumps" > "$env:RUNNER_TEMP\e2e-events.jsonl"
          $rc = $LASTEXITCODE
          "Engine exit code $rc after $($sw.Elapsed)"
          Get-Content "$env:RUNNER_TEMP\e2e-events.jsonl" | Where-Object { $_ -notmatch '"type": "progress"' }
          if ($rc -ne 0) { exit 1 }

      - name: Verify end-to-end results
        run: python tools/ci/verify_e2e.py "$env:RUNNER_TEMP\Audio dumps"

      - name: Collect verification material
        if: always()
        run: |
          New-Item -ItemType Directory -Force verification | Out-Null
          Copy-Item test-results.xml verification/ -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP\gui.png" verification/ -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP\e2e-events.jsonl" verification/ -ErrorAction SilentlyContinue
          if (Test-Path "$env:RUNNER_TEMP\Audio dumps\refined") { Copy-Item -Recurse "$env:RUNNER_TEMP\Audio dumps\refined" verification/e2e-refined }
          Copy-Item -Recurse "$env:LOCALAPPDATA\AudioRefine\logs" verification/logs -ErrorAction SilentlyContinue

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: AudioRefine-${{ env.APP_VERSION }}-win-x64
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Upload verification material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_number }}
          path: verification/
          retention-days: 30
